name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The embedding runtime is CPU-only. Keep onnxruntime-node from trying
      # to download a Linux GPU archive that is not published for this version.
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run model:download
      - run: npm test
      - name: Verify the adaptive benchmark builds and measures a disposable corpus
        run: |
          node scripts/benchmark-adaptive.mjs build "$RUNNER_TEMP/sam-adaptive" dist
          node scripts/benchmark-adaptive.mjs measure "$RUNNER_TEMP/sam-adaptive" dist
          find "$RUNNER_TEMP/sam-adaptive" -type f -name '*.db*' | sort > "$RUNNER_TEMP/sam-adaptive-dbs"
          test "$(cat "$RUNNER_TEMP/sam-adaptive-dbs")" = "$RUNNER_TEMP/sam-adaptive/corpus.db"
      - name: Verify generic installer and CLI
        run: |
          mkdir -p "$RUNNER_TEMP/work-project"
          npm run setup -- --root "$RUNNER_TEMP/shared-agent-memory" --project "$RUNNER_TEMP/work-project"
          node dist/cli/main.js check --config "$RUNNER_TEMP/shared-agent-memory/admin.config.json"
