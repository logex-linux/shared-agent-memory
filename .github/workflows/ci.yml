name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run model:download
      - run: npm test
      - name: Verify generic installer and CLI
        run: |
          mkdir -p "$RUNNER_TEMP/work-project"
          npm run setup -- --root "$RUNNER_TEMP/shared-agent-memory" --project "$RUNNER_TEMP/work-project"
          node dist/cli/main.js check --config "$RUNNER_TEMP/shared-agent-memory/admin.config.json"
